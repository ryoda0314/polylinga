<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ことのあめ 紹介スライド</title>
<!--
  ことのあめ の学び方（浴びる → 気づく → 言ってみる → また出会う）を紹介するスライド。
  再生のしくみは PBC2026_提案スライド と同じ: 1920×1080 の舞台に1枚が1場面で、init で組み、render(t) で
  場面の t 秒目の姿を描く。場面の中の止まる所（stops）ごとにボタンを待ち、そこに発表メモが付く。
  操作: → / スペース / クリックで次へ、← / 左端クリックで戻る、F 全画面、N 発表メモ（別ウィンドウ）、Home 最初から。
  例文はライブラリ（pl_sentences）とチュートリアル（src/lib/tutorial.ts）の実物、色は src/app/globals.css のトークン。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@500&family=Shippori+Mincho:wght@700&display=block">
<style>
/* Layout: a 1920×1080 stage scaled to the window; text set from a 120px left edge, hairlines instead of boxes.
   One light look on purpose (the app has no dark theme): the app's paper and ink, the icon's blue as the one
   accent, its violet for what comes back, and the icon's rain colours only for the falling rain. */
:root {
  --paper: #fcfbf8;
  --surface: #f1f4f8;
  --ink: #172033;
  --ink-2: #3b4558;
  --muted: #5c6578;
  --faint: #8c94a5;
  --line: #e4e7ec;
  --line-2: #d4d9e1;
  --accent: #0a64f0;
  --tint: #e6f0ff;
  --again: #6a4fe0;
  --again-tint: #efebff;
  --rain-blue: #0470fd;
  --rain-sky: #4ea7fd;
  --rain-violet: #a792fa;
  --rain-pink: #e79dfa;
  --rain-peach: #fec9a8;
  --on-accent: #ffffff;

  --font-ja: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-ko: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-en: "IBM Plex Sans", "Helvetica Neue", sans-serif;
  --font-mincho: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  color-scheme: light;
}
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
body { -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; cursor: default; }
#viewport {
  position: fixed; background: var(--paper);
  inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
  background: var(--paper); color: var(--ink); font-family: var(--font-ja); word-break: auto-phrase; line-break: strict;
}
#tick { position: fixed; inset: 0; pointer-events: none; background: var(--paper); opacity: 0.001; will-change: opacity; }
.scene { position: absolute; inset: 0; overflow: hidden; }
.inner { position: absolute; inset: 0; will-change: transform, opacity; }

#ui { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
#prog { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--surface); }
#progFill { position: absolute; inset: 0; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); transition: transform 0.5s ease; }
#pageNo { position: absolute; right: 48px; bottom: 24px; font-size: 20px; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
#hint { position: absolute; left: 48px; bottom: 24px; font-size: 20px; color: var(--faint); transition: opacity 1s; }
#loading { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--paper); font-size: 30px; font-weight: 600; color: var(--faint); }
#notesBar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; max-height: 40%; overflow: auto;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--paper); border-top: 1px solid var(--line-2); color: var(--ink); font: 500 16px/1.7 var(--font-ja);
}
#notesBar b { display: block; font-size: 13px; color: var(--muted); }

.t-ko { font-family: var(--font-ko); }
.t-zh { font-family: var(--font-zh); }
.t-en { font-family: var(--font-en); }
.t-ja { font-family: var(--font-ja); }
.abs { position: absolute; }
.v { will-change: transform, opacity; }
.ov { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
.ov path, .draw { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; }

/* A slide's heading: which part of the talk, then what the slide says. */
.head { position: absolute; left: 120px; top: 76px; width: 1680px; }
.kick { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; }
.kick::before { content: ""; width: 5px; height: 28px; border-radius: 3px; background: var(--accent); }
.title { margin: 14px 0 0; font-size: 58px; line-height: 1.3; font-weight: 700; letter-spacing: -0.005em; text-wrap: balance; }
.sub { margin: 12px 0 0; font-size: 28px; line-height: 1.6; font-weight: 500; color: var(--muted); }
.label { font-size: 24px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
.small { margin: 0; font-size: 24px; line-height: 1.6; font-weight: 500; color: var(--muted); }
/* A line that says the point, with the app's raindrop as its mark. */
.cap { margin: 0; display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 700; white-space: nowrap; }
.cap::before { content: ""; flex: none; width: 6px; height: 40px; border-radius: 3px; background: var(--accent); }

/* The rain, as the app draws it: each sentence falls in, its drop lands beside it, and it stays. */
.rl { position: absolute; margin: 0; padding: 0; list-style: none; border-top: 2px solid var(--line); }
.ri { display: flex; align-items: center; gap: 22px; padding: var(--pad, 20px) 0; border-bottom: 2px solid var(--line); will-change: transform, opacity; }
.ri .drop { flex: none; align-self: stretch; width: 5px; margin-block: 8px; border-radius: 3px; background: var(--line-2); transform-origin: top; transform: scaleY(0); }
.ri .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ri .s { font-size: var(--fs, 44px); font-weight: 500; line-height: 1.5; color: var(--ink); white-space: nowrap; }
.ri .g { font-size: var(--gs, 24px); line-height: 1.5; color: var(--muted); white-space: nowrap; }
.ri.on .drop { background: var(--accent); }
.ri.on .s { color: var(--accent); }
.play {
  position: relative; flex: none; width: var(--pb, 60px); height: var(--pb, 60px); border-radius: 50%;
  border: 2px solid var(--line-2); background: var(--paper); color: var(--ink); display: grid; place-items: center; box-sizing: border-box;
}
.play svg { position: relative; width: 40%; height: 40%; }
.play .ring { position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; }
.play.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
/* A lit part (the shared way of saying, or a word): JS sets its tint and colour. */
.mk, .pt { border-radius: 0.15em; padding: 0 0.06em; margin: 0 -0.06em; }
/* A memo word met again: dotted violet underline (its colour is faded in by JS). */
.memo { text-decoration-line: underline; text-decoration-style: dotted; text-decoration-thickness: 3px; text-underline-offset: 0.28em; text-decoration-color: transparent; }

/* Title and end. */
.rainfield { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.wordmark { margin: 0; font-family: var(--font-mincho); font-weight: 700; font-size: 156px; line-height: 1.15; letter-spacing: 0.06em; white-space: nowrap; }
.wordmark > span { display: inline-block; }
.wordmark .kanji { margin-left: 30px; font-size: 40px; letter-spacing: 0.08em; color: var(--muted); }
.lead { margin: 0; font-size: 46px; line-height: 1.5; font-weight: 500; }
.meta { margin: 0; font-size: 28px; font-weight: 500; color: var(--muted); }
.kokin { margin: 0; font-family: var(--font-mincho); font-weight: 700; font-size: 34px; color: var(--ink-2); letter-spacing: 0.04em; }
.endline { margin: 0; font-family: var(--font-mincho); font-weight: 700; font-size: 96px; line-height: 1.4; letter-spacing: 0.04em; white-space: nowrap; }
.endline span { display: inline-block; }
.sign { display: flex; align-items: center; gap: 24px; }
.sign img { width: 84px; height: 84px; }
.sign b { font-family: var(--font-mincho); font-weight: 700; font-size: 50px; letter-spacing: 0.06em; }
.sign span { margin-left: 18px; font-family: var(--font-en); font-size: 28px; color: var(--muted); }

/* Knowing is not using. */
.vocab { display: flex; align-items: baseline; gap: 28px; width: 780px; padding-bottom: 12px; border-bottom: 2px solid var(--line); }
.vocab .w { min-width: 260px; font-size: 36px; font-weight: 500; }
.vocab .m { flex: 1; font-size: 28px; color: var(--ink-2); }
.vocab .ok { align-self: center; width: 30px; height: 30px; color: var(--accent); }
.bubble { display: inline-block; padding: 22px 32px; background: var(--surface); border-radius: 32px 32px 32px 10px; font-size: 40px; font-weight: 500; }
.bubble.sm { padding: 14px 24px; border-radius: 26px 26px 26px 8px; font-size: 28px; }
.bgloss { margin-top: 12px; font-size: 24px; color: var(--muted); }
.field { height: 96px; border: 2px solid var(--line-2); border-radius: 48px; display: flex; align-items: center; gap: 2px; padding: 0 36px; box-sizing: border-box; background: var(--paper); font-size: 38px; }
.field.sq { height: 100px; border-radius: 16px; padding: 0 28px; }
.caret { display: inline-block; flex: none; width: 3px; height: 46px; border-radius: 2px; background: var(--accent); }
.think { margin: 0; font-size: 32px; font-weight: 500; color: var(--muted); }

/* The author's own way: sentences side by side, a guess. */
.thought { transform-origin: 0 100%; }
.thought p { margin: 0; padding: 34px 44px; border: 3px solid var(--ink); border-radius: 44px; background: var(--paper); font-size: 38px; line-height: 1.55; font-weight: 600; }
.thought i { position: absolute; border: 3px solid var(--ink); border-radius: 50%; background: var(--paper); }
.thought .d1 { width: 26px; height: 26px; left: -36px; bottom: -6px; }
.thought .d2 { width: 14px; height: 14px; left: -64px; bottom: -30px; }
.fills { display: flex; gap: 56px; }
.fill { display: flex; align-items: center; gap: 16px; font-size: 38px; font-weight: 700; white-space: nowrap; }
.fill::before { content: ""; width: 6px; height: 40px; border-radius: 3px; background: var(--accent); }
.fill.again { color: var(--again); }
.fill.again::before { background: var(--again); }

/* The loop. */
.node { width: 375px; }
.node .no { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--accent); box-sizing: border-box; background: var(--paper); color: var(--accent); font-size: 26px; font-weight: 700; }
.node.again .no { border-color: var(--again); color: var(--again); }
.node b { display: block; margin-top: 20px; font-size: 64px; line-height: 1.3; font-weight: 700; }
.node p { margin: 16px 0 0; font-size: 27px; line-height: 1.6; font-weight: 500; color: var(--muted); }
.track { stroke: var(--ink-2); stroke-width: 3; }
.arc { stroke: var(--again); stroke-width: 4; }
.arcl { text-align: center; font-size: 30px; font-weight: 600; color: var(--again); }
.tag { width: 375px; font-size: 27px; font-weight: 600; color: var(--ink-2); }
.tag::before { content: ""; display: block; width: 28px; height: 3px; margin-bottom: 12px; background: var(--ink-2); }
.tag.again { color: var(--again); }
.tag.again::before { background: var(--again); }

/* 1 浴びる: the app on a phone, and what to take from it. */
.pnt { display: grid; grid-template-columns: 6px 1fr; column-gap: 22px; width: 900px; }
.pnt::before { content: ""; grid-row: span 2; width: 6px; margin: 8px 0; border-radius: 3px; background: var(--accent); }
.pnt b { font-size: 36px; line-height: 1.4; font-weight: 700; }
.pnt span { margin-top: 4px; font-size: 26px; line-height: 1.6; color: var(--muted); }
.phone { position: absolute; left: 1160px; top: 120px; width: 560px; height: 872px; box-sizing: border-box; padding: 14px; border: 3px solid var(--ink); border-radius: 76px; background: var(--paper); }
.screen { position: relative; height: 100%; overflow: hidden; border-radius: 62px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--line); }
.notch { position: absolute; top: 16px; left: 50%; width: 132px; height: 36px; margin-left: -66px; border-radius: 18px; background: var(--ink); }
.scr { position: absolute; left: 30px; right: 30px; top: 84px; }
.scr-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
.scr-head b { font-size: 34px; font-weight: 700; }
.scr-head span { font-size: 18px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
.inphone { --fs: 30px; --gs: 18px; --pad: 16px; --pb: 52px; }
.inphone .ri { gap: 16px; }
.inphone .ri .drop { width: 4px; }
.qbtn { margin-top: 22px; height: 64px; display: grid; place-items: center; border: 2px solid var(--line-2); border-radius: 14px; background: var(--paper); font-size: 22px; font-weight: 500; }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; padding-bottom: 10px; box-sizing: border-box; border-top: 2px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; text-align: center; font-size: 18px; color: var(--muted); }
.tabs b { color: var(--accent); font-weight: 600; }

/* 2 気づく: the learner's tap, then the answer. */
.pointer { position: absolute; left: 0; top: 0; width: 64px; height: 64px; box-sizing: border-box; border-radius: 50%; border: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); opacity: 0; will-change: transform, opacity; }
.pointer .ring { position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; }
.tapped { margin-top: 6px; font-size: 56px; font-weight: 600; color: var(--accent); }
.answer { padding: 34px 40px; box-sizing: border-box; border-radius: 20px; background: var(--surface); }
.answer b { display: block; margin-top: 8px; font-size: 52px; font-weight: 700; }
.answer p { margin: 8px 0 0; font-size: 28px; line-height: 1.5; font-weight: 500; }
.answer p.small { margin-top: 14px; font-size: 22px; color: var(--muted); }

/* 3 言ってみる: what they wrote, what it became, word by word, and sent. */
.intent { margin-top: 8px; font-size: 38px; font-weight: 600; }
.send { height: 76px; padding: 0 40px; display: grid; place-items: center; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-size: 28px; font-weight: 600; }
.send span { grid-area: 1 / 1; }
.said { display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; align-items: baseline; }
.said .tag2 { font-size: 22px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; white-space: nowrap; }
.said .before { font-size: 32px; color: var(--muted); }
.said .after { font-size: 44px; font-weight: 600; }
.del { position: relative; color: var(--faint); }
.del .st { position: absolute; left: -2px; right: -2px; top: 54%; height: 3px; background: var(--faint); transform-origin: 0 50%; transform: scaleX(0); }
.ins { position: relative; color: var(--accent); font-weight: 700; }
.ins .ul { position: absolute; left: 0; right: 0; bottom: -2px; height: 4px; border-radius: 2px; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); }
.why { margin: 0; font-size: 26px; line-height: 1.6; color: var(--ink-2); }
.explain { padding: 28px 34px; box-sizing: border-box; border: 2px solid var(--line-2); border-radius: 20px; background: var(--paper); }
.explain .es { margin: 12px 0 0; font-size: 38px; line-height: 1.6; font-weight: 500; }
.explain .eg { margin: 2px 0 0; font-size: 24px; color: var(--muted); }
.explain ul { margin: 16px 0 0; padding: 0; list-style: none; border-top: 2px solid var(--line); }
.explain li { display: grid; grid-template-columns: 2fr 3fr; gap: 16px; align-items: baseline; padding: 6px 10px; border-bottom: 2px solid var(--line); }
.explain li .w { font-size: 28px; font-weight: 500; }
.explain li .m { font-size: 24px; color: var(--ink-2); }
.sent { padding: 14px 26px; border-radius: 26px 26px 8px 26px; background: var(--accent); color: var(--on-accent); font-size: 30px; font-weight: 500; }
.bgl2 { margin-left: 16px; font-size: 22px; color: var(--muted); }

/* 4 また出会う: the widening days, the rain that brings it back, the memo. */
.tl { height: 4px; border-radius: 2px; background: var(--ink-2); transform-origin: 0 50%; }
.dot { position: absolute; width: 22px; height: 22px; border: 4px solid var(--paper); border-radius: 50%; background: var(--accent); will-change: transform; }
.dot.again { background: var(--again); }
.pulse { position: absolute; width: 30px; height: 30px; box-sizing: border-box; border: 3px solid var(--again); border-radius: 50%; opacity: 0; }
.gap { position: absolute; top: 368px; width: 120px; margin-left: -60px; text-align: center; font-size: 24px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.under { position: absolute; top: 458px; width: 160px; margin-left: -80px; text-align: center; font-size: 22px; font-weight: 600; color: var(--muted); }
.under.again { color: var(--again); }
.badge { font-size: 22px; font-weight: 600; letter-spacing: 0.04em; color: var(--again); }
.memonote { margin: 0; font-size: 24px; font-weight: 500; color: var(--again); }
.mfield { height: 84px; margin-top: 10px; justify-content: flex-start; }
.mfield .typed { min-width: 0; }
.mbtn { margin-left: auto; display: grid; height: 56px; padding: 0 22px; place-items: center; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 22px; font-weight: 600; }
.mbtn span { grid-area: 1 / 1; }
.stages { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.stg { padding: 10px 14px; border: 2px solid var(--line-2); border-radius: 999px; font-size: 24px; font-weight: 600; color: var(--faint); white-space: nowrap; }
.sar { font-style: normal; font-size: 24px; color: var(--faint); }

/* 続ける: the cue, the train, a month with gaps. */
.ask { font-size: 28px; font-weight: 600; color: var(--ink-2); }
.opts { display: flex; gap: 14px; }
.opt { padding: 10px 22px; border: 2px solid var(--line-2); border-radius: 999px; background: var(--paper); font-size: 24px; font-weight: 500; white-space: nowrap; }
.cueline { font-size: 64px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.why2 { margin: 0; font-size: 30px; line-height: 1.6; color: var(--ink-2); }
.train .track2 { stroke: var(--ink-2); stroke-width: 4; }
.train .body { fill: var(--paper); stroke: var(--ink); stroke-width: 3; }
.train .win { fill: var(--surface); stroke: var(--ink-2); stroke-width: 2.5; }
.train .stripe { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
.train .wrain path { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
.train .wheel { fill: var(--paper); stroke: var(--ink); stroke-width: 3; }
.cal { width: 700px; }
.calhead { display: flex; align-items: baseline; gap: 18px; }
.calhead b { font-size: 34px; font-weight: 700; }
.calhead span { font-size: 22px; color: var(--muted); }
.wk, .grid { display: grid; grid-template-columns: repeat(7, 1fr); column-gap: 6px; }
.wk { margin-top: 16px; font-size: 20px; color: var(--muted); text-align: center; }
.grid { margin-top: 8px; row-gap: 6px; }
.day { position: relative; height: 76px; border-top: 2px solid var(--line); border-radius: 0 0 8px 8px; }
.day.blank { border-top-color: transparent; }
.day span { position: absolute; left: 8px; top: 6px; font-size: 18px; color: var(--faint); font-variant-numeric: tabular-nums; }
.day .r { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 8px; }
.day .r b { width: 6px; height: 28px; border-radius: 3px; background: var(--accent); transform-origin: top; transform: scaleY(0); }
.pnt2 { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 600; white-space: nowrap; }
.pnt2::before { content: ""; width: 5px; height: 30px; border-radius: 3px; background: var(--accent); }

/* 例文: one set in four languages, how sentences are made. */
.lrow { display: flex; align-items: baseline; gap: 30px; width: 1060px; height: 84px; padding-top: 14px; box-sizing: border-box; border-top: 2px solid var(--line); }
.lrow.last { height: 86px; border-bottom: 2px solid var(--line); }
.lrow .lang { flex: none; width: 120px; font-size: 24px; font-weight: 600; color: var(--muted); }
.lrow .s { font-size: 40px; font-weight: 500; white-space: nowrap; }
.fn { display: block; margin: 6px 0 14px; font-size: 60px; font-weight: 700; }
.flow { display: flex; align-items: center; gap: 16px; }
.fstep { padding: 16px 26px; border: 2px solid var(--line-2); border-radius: 14px; background: var(--paper); font-size: 28px; font-weight: 600; white-space: nowrap; }
.fstep.maybe { border-style: dashed; }
.fstep.pub { border-color: var(--accent); color: var(--accent); }
.far { color: var(--faint); display: grid; }
.nums { display: flex; align-items: baseline; gap: 64px; }
.num { white-space: nowrap; }
.num b { font-size: 68px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.num span { margin-left: 8px; font-size: 26px; font-weight: 600; color: var(--ink-2); }
.pnt3 { display: grid; grid-template-columns: 6px 1fr; column-gap: 20px; font-size: 28px; line-height: 1.5; font-weight: 600; }
.pnt3::before { content: ""; width: 6px; border-radius: 3px; background: var(--accent); }

/* なぜ効くのか: each step, what is known, where from. */
.wrow { position: absolute; left: 120px; width: 1680px; display: grid; grid-template-columns: 270px 1000px 1fr; column-gap: 30px; padding-top: 20px; border-top: 2px solid var(--line); }
.wrow b { display: flex; align-items: center; gap: 16px; font-size: 34px; line-height: 1.4; font-weight: 700; white-space: nowrap; }
.wrow b::before { content: ""; width: 6px; height: 36px; border-radius: 3px; background: var(--accent); }
.wrow.again b::before { background: var(--again); }
.wrow p { margin: 0; font-size: 28px; line-height: 1.55; font-weight: 500; }
.wrow .src { font-size: 20px; line-height: 1.5; color: var(--muted); }
.wrow .src em { display: block; font-style: normal; font-size: 22px; font-weight: 600; color: var(--ink-2); }

/* やらないこと. */
.nbox { position: absolute; top: 300px; width: 312px; height: 116px; box-sizing: border-box; display: grid; place-items: center; border: 2px solid var(--line-2); border-radius: 16px; font-size: 30px; font-weight: 600; white-space: nowrap; }
.nbox .x { position: absolute; left: 28px; right: 28px; top: 50%; height: 3px; margin-top: -1.5px; background: var(--ink); transform-origin: 0 50%; transform: scaleX(0); }
.pnt4 { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 600; white-space: nowrap; }
.pnt4::before { content: ""; width: 6px; height: 38px; border-radius: 3px; background: var(--accent); }
</style>
</head>
<body>
<div id="viewport">
  <div id="tick"></div>
  <div id="stage" lang="ja">
    <div id="ui"><div id="prog"><i id="progFill"></i></div><div id="pageNo"></div><div id="hint"></div></div>
    <div id="loading">読み込んでいます…</div>
  </div>
  <div id="notesBar" hidden></div>
</div>
<script>
"use strict";
(async function () {
  // The icon arrives in the last script of the page.
  if (document.readyState === "loading") await new Promise((r) => addEventListener("DOMContentLoaded", r, { once: true }));
  const ICON = window.ICON || "";
  if (!document.documentElement.lang) document.documentElement.lang = "ja";
  const stage = document.getElementById("stage");
  const ui = document.getElementById("ui");
  const vp = document.getElementById("viewport");
  const W = 1920, H = 1080;
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let scale = 1;
  function fit() {
    const w = vp.clientWidth, h = vp.clientHeight;
    scale = Math.min(w / W, h / H);
    stage.style.transform = `translate(${(w - W * scale) / 2}px, ${(h - H * scale) / 2}px) scale(${scale})`;
  }
  addEventListener("resize", fit);
  fit();

  // ---- Timing: everything is a function of the scene's time t (seconds) ----------------------------
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = (x) => 1 - Math.pow(1 - clamp01(x), 3);
  const eoq = (x) => 1 - Math.pow(1 - clamp01(x), 4);
  const eio = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const eob = (x, o = 1.6) => { x = clamp01(x); return 1 + (o + 1) * Math.pow(x - 1, 3) + o * Math.pow(x - 1, 2); };

  // The colours, read from the tokens above so the JS never has its own.
  const css = getComputedStyle(document.documentElement);
  const hex = (n) => { const v = css.getPropertyValue("--" + n).trim(); return [1, 3, 5].map((i) => parseInt(v.slice(i, i + 2), 16)); };
  const C = {
    ink: hex("ink"), muted: hex("muted"), faint: hex("faint"), line2: hex("line-2"),
    accent: hex("accent"), tint: hex("tint"), again: hex("again"), againTint: hex("again-tint"),
    rain: ["rain-blue", "rain-sky", "rain-violet", "rain-pink", "rain-peach"].map(hex),
  };
  const mix = (a, b, k) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(",")})`;
  const rgba = (a, k) => `rgba(${a.join(",")},${clamp01(k).toFixed(3)})`;

  // ---- Building and moving parts ---------------------------------------------------------------------
  function el(parent, html) {
    const tpl = document.createElement("template");
    tpl.innerHTML = html.trim();
    const n = tpl.content.firstElementChild;
    parent.appendChild(n);
    return n;
  }
  // In at tin, fading, from dx/dy. (Every part leaves with its slide; see draw().)
  function vis(n, t, tin, o = {}) {
    const k = eo(seg(t, tin, tin + (o.d || 0.5)));
    const dx = o.dx === undefined ? 26 : o.dx, dy = o.dy || 0;
    n.style.opacity = k.toFixed(3);
    n.style.transform = k >= 1 ? "none" : `translate(${((1 - k) * dx).toFixed(1)}px,${((1 - k) * dy).toFixed(1)}px)`;
    return k;
  }
  // The app's rain-fall: from 44px above, opaque by the middle, landing softly (shower.module.css).
  function fall(n, t, tin) {
    const p = seg(t, tin, tin + 0.75);
    n.style.opacity = Math.min(1, p / 0.55).toFixed(3);
    n.style.transform = p >= 1 ? "none" : `translateY(${(-44 * (1 - eoq(p))).toFixed(1)}px)`;
    return p;
  }
  // The drop beside a sentence lands just after it.
  const land = (drop, t, tin) => { drop.style.transform = `scaleY(${eo(seg(t, tin + 0.25, tin + 0.7)).toFixed(3)})`; };
  // A part lit: the tint behind it and the accent on it (violet for what comes back).
  function mark(n, k, again, base) {
    const c = again ? [C.againTint, C.again] : [C.tint, C.accent];
    n.style.backgroundColor = k > 0 ? rgba(c[0], k) : "";
    n.style.color = k > 0 ? mix(base || C.ink, c[1], k) : "";
  }
  const stroke = (path, k) => { path.style.strokeDashoffset = (1 - clamp01(k)).toFixed(4); };
  const pop = (n, t, tin, x, y) => { const k = eob(seg(t, tin, tin + 0.35)); n.style.transform = `translate(${x}px,${y}px) scale(${Math.max(0, k).toFixed(3)})`; n.style.opacity = clamp01(k * 3).toFixed(3); };
  function srect(n) {
    const b = n.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return { x: (b.left - s.left) / scale, y: (b.top - s.top) / scale, w: b.width / scale, h: b.height / scale };
  }
  function head(parent, kick, title, sub) {
    const h = el(parent, `<div class="head"><div class="kick v">${kick}</div><h2 class="title v">${title}</h2>${sub ? `<p class="sub v">${sub}</p>` : ""}</div>`);
    return { box: h, kick: h.querySelector(".kick"), title: h.querySelector(".title"), sub: h.querySelector(".sub") };
  }
  function headVis(h, t, tin = 0) {
    vis(h.kick, t, tin, { d: 0.4 });
    vis(h.title, t, tin + 0.12);
    if (h.sub) vis(h.sub, t, tin + 0.3);
  }

  const PLAY = '<span class="play"><i class="ring"></i><i class="ring"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span>';
  // A rain list as the app draws it. items: [sentence html, translation html]; .mk spans are the parts that light.
  function rainList(parent, items, o = {}) {
    const ul = document.createElement("ul");
    ul.className = "rl" + (o.cls ? " " + o.cls : "");
    if (o.left !== undefined) ul.style.cssText = `left:${o.left}px;top:${o.top}px;width:${o.width}px;`;
    else ul.style.position = "relative";
    if (o.fs) ul.style.setProperty("--fs", o.fs + "px");
    if (o.gs) ul.style.setProperty("--gs", o.gs + "px");
    if (o.pad) ul.style.setProperty("--pad", o.pad + "px");
    ul.innerHTML = items.map(([s, g]) =>
      `<li class="ri"><i class="drop"></i><div class="main"><div class="s t-${o.lang || "ko"}">${s}</div><div class="g">${g}</div></div>${o.play ? PLAY : ""}</li>`).join("");
    parent.appendChild(ul);
    const rows = [...ul.children].map((li) => ({
      li, drop: li.querySelector(".drop"), s: li.querySelector(".s"), play: li.querySelector(".play"),
      marks: [...li.querySelectorAll(".s .mk")], gmarks: [...li.querySelectorAll(".g .mk")],
    }));
    return { ul, rows };
  }
  // While a clip plays, its row turns blue and ripples spread from the button.
  function playing(row, t, a, b) {
    const on = t >= a && t < b;
    row.li.classList.toggle("on", on);
    row.play.classList.toggle("on", on);
    row.play.querySelectorAll(".ring").forEach((r, i) => {
      if (!on) { r.style.opacity = 0; return; }
      const ph = ((t - a) / 1.6 + i * 0.5) % 1;
      r.style.opacity = (0.55 * (1 - ph)).toFixed(3);
      r.style.transform = `scale(${(1 + 0.9 * ph).toFixed(3)})`;
    });
  }
  // Fine rain in the icon's colours, behind the title and the end (and nowhere else).
  function rng(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function rainField(parent, seed, from) {
    const cv = el(parent, '<canvas class="rainfield" width="1920" height="1080"></canvas>');
    const ctx = cv.getContext("2d");
    const r = rng(seed);
    const drops = Array.from({ length: 110 }, () => {
      const near = r() < 0.8;
      return {
        x: near ? lerp(from, 1890, r()) : lerp(40, from, r()), y: r() * 1400, v: lerp(150, 330, r()),
        len: lerp(24, 62, r()), w: r() < 0.3 ? 5 : 3.5, c: C.rain[Math.floor(r() * 5)], a: (near ? 1 : 0.35) * lerp(0.3, 0.7, r()),
      };
    });
    let still = false;
    return {
      canvas: cv,
      draw(now) {
        if (RM) { if (still) return; still = true; now = 3000; }
        ctx.clearRect(0, 0, W, H);
        ctx.lineCap = "round";
        for (const d of drops) {
          const span = H + d.len + 160;
          const y = ((d.y + (d.v * now) / 1000) % span) - d.len - 80;
          ctx.strokeStyle = rgba(d.c, d.a);
          ctx.lineWidth = d.w;
          ctx.beginPath();
          ctx.moveTo(d.x, y);
          ctx.lineTo(d.x, y + d.len);
          ctx.stroke();
        }
      },
    };
  }

  const CHECK = '<svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ARROW = '<svg width="40" height="22" viewBox="0 0 40 22" aria-hidden="true"><path d="M2 11H36M27 3l9 8-9 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // Library sentences of 誘う (the tutorial's), lit where the way of saying is.
  const INVITE = [
    ['내일 카페 <span class="mk">갈래</span>?', '明日カフェ行か<span class="mk">ない</span>？'],
    ['주말에 영화 <span class="mk">볼래</span>?', '週末、映画見<span class="mk">ない</span>？'],
    ['같이 밥 <span class="mk">먹을래</span>?', '一緒にご飯食べ<span class="mk">ない</span>？'],
    ['오늘 노래방 <span class="mk">갈래</span>?', '今日カラオケ行か<span class="mk">ない</span>？'],
  ];

  // ---- The scenes ----------------------------------------------------------------------------------
  // stops: [time, speaker note]. The scene waits at each; the last one is where its parts leave.
  const SCENES = [];
  const scene = (id, def) => SCENES.push(Object.assign({ id }, def));

  scene("title", {
    name: "表紙",
    stops: [[1.6, "ことのあめは、外国語を「使える言葉」にするための学習アプリです。今日は、その中にある学び方がどういう仕組みで、なぜ効くのかを紹介します。"]],
    init(box) {
      this.rain = rainField(box, 7, 1000);
      this.icon = el(box, `<img class="abs v" src="${ICON}" alt="" style="left:120px;top:252px;width:136px;height:136px">`);
      const wm = el(box, '<h1 class="wordmark abs" style="left:112px;top:404px"></h1>');
      this.kana = [..."ことのあめ"].map((c) => el(wm, `<span class="v">${c}</span>`));
      this.kanji = el(wm, '<span class="kanji v">言の雨</span>');
      this.lead = el(box, '<p class="lead abs v" style="left:120px;top:640px">例文の雨を浴びて、使える言葉へ。</p>');
      this.meta = el(box, '<p class="meta abs v" style="left:120px;top:726px">日本語を話す人のための、韓国語・英語・中国語の学び方</p>');
    },
    render(t) {
      this.rain.canvas.style.opacity = eo(seg(t, 0, 1.2)).toFixed(3);
      vis(this.icon, t, 0.1, { dx: 0, dy: 18 });
      this.kana.forEach((s, i) => fall(s, t, 0.25 + i * 0.09));
      vis(this.kanji, t, 0.85, { dx: 0, dy: 10 });
      vis(this.lead, t, 0.95);
      vis(this.meta, t, 1.1);
    },
    idle(now) { this.rain.draw(now); },
  });

  scene("gap", {
    name: "知っている ≠ 使える",
    stops: [
      [2.6, "単語帳で単語を覚えて、文法の表も覚える。テストなら点が取れます。"],
      [5.2, "でも、友だちに「今週末なにするの？」と聞かれた瞬間に、言葉が出てこない。知っていることと、使えることは別なんです。"],
      [6.1, "作者自身も、韓国語を勉強していたとき、まさにこの壁にぶつかりました。"],
    ],
    init(box) {
      this.h = head(box, "はじめに", "知っているのに、言いたいときに出てこない");
      this.l1 = el(box, '<div class="label abs v" style="left:120px;top:300px">知っている</div>');
      const words = [["주말", "週末"], ["영화", "映画"], ["같이", "一緒に"], ["카페", "カフェ"], ["보다", "見る"], ["V + (으)ㄹ래?", "〜する？（相手の意向を聞く）"]];
      this.rows = words.map((w, i) => el(box, `<div class="vocab abs v" style="left:120px;top:${350 + i * 72}px"><span class="w t-ko">${w[0]}</span><span class="m">${w[1]}</span>${CHECK}</div>`));
      this.done = el(box, '<p class="small abs v" style="left:120px;top:806px;font-size:28px;color:var(--ink-2)">単語帳も、文法の表も、ちゃんと覚えた</p>');
      this.l2 = el(box, '<div class="label abs v" style="left:1040px;top:300px">使う</div>');
      this.friend = el(box, '<div class="abs v" style="left:1040px;top:356px"><div class="bubble t-ko">이번 주말에 뭐 해?</div><div class="bgloss">今週末、なにするの？</div></div>');
      this.input = el(box, '<div class="field abs v" style="left:1040px;top:548px;width:760px"><i class="caret"></i></div>');
      this.caret = this.input.querySelector(".caret");
      this.um = el(box, '<p class="think abs v" style="left:1076px;top:676px">えっと……</p>');
      this.cap = el(box, '<p class="cap abs v" style="left:120px;top:872px">知っていることと、使えることは別</p>');
      this.me = el(box, '<p class="small abs v" style="left:144px;top:936px;font-size:28px;color:var(--ink-2)">作者も、韓国語を勉強していたとき、この壁にぶつかった</p>');
    },
    render(t) {
      headVis(this.h, t);
      vis(this.l1, t, 0.3);
      this.rows.forEach((r, i) => {
        fall(r, t, 0.45 + i * 0.24);
        r.querySelector(".ok").style.opacity = eo(seg(t, 0.95 + i * 0.24, 1.25 + i * 0.24)).toFixed(3);
      });
      vis(this.done, t, 2.0);
      vis(this.l2, t, 2.8);
      fall(this.friend, t, 3.0);
      vis(this.input, t, 3.6, { dx: 0, dy: 12 });
      this.caretOn = t >= 3.6;
      vis(this.um, t, 4.2, { dx: 0, dy: 8 });
      vis(this.cap, t, 4.6);
      vis(this.me, t, 5.5);
    },
    idle(now) { this.caret.style.opacity = this.caretOn && (RM || Math.floor(now / 530) % 2 === 0) ? 1 : 0; },
  });

  scene("origin", {
    name: "作者の体験",
    stops: [
      [2.8, "その壁を越えられたのは、やり方を変えてからです。一つの文をそのまま覚えるのをやめて、似た文をいくつも集めました。"],
      [4.4, "並べると「고 싶어요」が共通しています。訳はどれも「〜したい」。もしかして、この部分が「〜したい」を表しているんじゃないか、と自分で気づきます。"],
      [6.0, "こうして1年で、韓国語が勉強する言葉から使う言葉になりました。効いていたのは、反復、実際に使うこと、直してもらうこと、そして忘れてもまた出会うことでした。"],
    ],
    init(box) {
      this.h = head(box, "作者の体験", "似た文を集めて、共通しているところを探した", "壁を越えたきっかけ。一つの文をそのまま覚えるのをやめた");
      this.list = rainList(box, [
        ['가<span class="mk">고 싶어요</span>', '行き<span class="mk">たい</span>です'],
        ['먹<span class="mk">고 싶어요</span>', '食べ<span class="mk">たい</span>です'],
        ['말하<span class="mk">고 싶어요</span>', '話し<span class="mk">たい</span>です'],
      ], { left: 120, top: 330, width: 860, fs: 50, gs: 26, pad: 20 });
      this.think = el(box, '<div class="thought abs" style="left:1120px;top:420px"><p>もしかして、この部分が<br>「〜したい」を表している？</p><i class="d1"></i><i class="d2"></i></div>');
      this.l = el(box, '<div class="label abs v" style="left:120px;top:842px">1年で「使う言葉」になるまでに、効いていたのは</div>');
      const fills = el(box, '<div class="fills abs" style="left:120px;top:890px"></div>');
      this.fills = ["反復", "実際の使用", "フィードバック", "忘れても、また出会うこと"].map((w, i) => el(fills, `<span class="fill v${i === 3 ? " again" : ""}">${w}</span>`));
    },
    render(t) {
      headVis(this.h, t);
      this.list.rows.forEach((r, i) => {
        fall(r.li, t, 0.7 + i * 0.6);
        land(r.drop, t, 0.7 + i * 0.6);
        const k = eo(seg(t, 3.0 + i * 0.15, 3.35 + i * 0.15));
        r.marks.forEach((m) => mark(m, k));
        r.gmarks.forEach((m) => mark(m, k, false, C.muted));
      });
      const k = eo(seg(t, 3.6, 4.1));
      this.think.style.opacity = k.toFixed(3);
      this.think.style.transform = `scale(${(0.94 + 0.06 * k).toFixed(3)})`;
      vis(this.l, t, 4.6);
      this.fills.forEach((f, i) => vis(f, t, 4.8 + i * 0.2));
    },
  });

  scene("cycle", {
    name: "しくみ",
    stops: [
      [3.1, "ことのあめは、この体験をそのままアプリにしました。浴びる、気づく、言ってみる、また出会う。この4つをくり返します。忘れても、また降ってきます。"],
      [4.5, "原体験で効いていた4つが、それぞれの動きに入っています。ここから一つずつ見ていきます。"],
    ],
    init(box) {
      this.h = head(box, "しくみ", "4つの動きを、くり返す");
      const N = [
        ["浴びる", "同じかたちの文が、<br>音声付きで降ってくる"],
        ["気づく", "共通しているところを、<br>自分で探す"],
        ["言ってみる", "そのかたちで自分の文を<br>作り、AIが直す"],
        ["また出会う", "日をあけて、別の文で<br>また降ってくる"],
      ];
      const L = (i) => 120 + i * 435;
      this.nodes = N.map((n, i) => el(box, `<div class="node abs v${i === 3 ? " again" : ""}" style="left:${L(i)}px;top:330px"><span class="no">${i + 1}</span><b>${n[0]}</b><p>${n[1]}</p></div>`));
      const segs = [0, 1, 2].map((i) => {
        const x0 = L(i) + 26 + 40, x1 = L(i + 1) + 26 - 40;
        return `<path class="track" pathLength="1" d="M${x0} 356H${x1}M${x1 - 11} 346L${x1} 356L${x1 - 11} 366"/>`;
      }).join("");
      const ov = el(box, `<svg class="ov" viewBox="0 0 1920 1080">${segs}<path class="arc" pathLength="1" d="M1451 612C1451 760 146 760 146 620M133 634L146 620L159 634"/></svg>`);
      this.track = [...ov.querySelectorAll(".track")];
      this.arc = ov.querySelector(".arc");
      this.arcl = el(box, '<div class="arcl abs v" style="left:498px;width:600px;top:744px">忘れても、また降ってくる</div>');
      this.tl = el(box, '<div class="label abs v" style="left:120px;top:830px">作者の体験で効いていたもの</div>');

      this.cue = el(box, '<div class="cueline abs v" style="left:120px;top:452px">電車に乗ったら、ひと雨。</div>');
      this.why = el(box, '<p class="why2 abs v" style="left:120px;top:560px">毎日していることの「あと」に決めておくと、<br>考えなくても続く</p>');
      this.train = el(box, '<svg class="train abs" style="left:120px;top:700px" width="880" height="210" viewBox="0 0 880 210" aria-hidden="true">' +
        '<path class="track2 draw" pathLength="1" d="M4 196H876"/><g class="car">' +
        '<rect class="body" x="2" y="40" width="430" height="128" rx="28"/>' +
        [34, 128, 222, 316].map((x) => `<rect class="win" x="${x}" y="64" width="72" height="52" rx="8"/>`).join("") +
        '<path class="stripe" d="M18 140H416"/><g class="wrain"><path d="M152 74v14"/><path d="M166 82v18"/><path d="M180 72v14"/></g>' +
        '<circle class="wheel" cx="96" cy="176" r="14"/><circle class="wheel" cx="338" cy="176" r="14"/></g></svg>');
      this.track = this.train.querySelector(".track2");
      this.car = this.train.querySelector(".car");
      this.wrain = this.train.querySelector(".wrain");
      const cells = [];
      for (let i = 0; i < 4; i++) cells.push('<div class="day blank"></div>');
      MONTH.forEach((n, i) => cells.push(`<div class="day"><span>${i + 1}</span><i class="r">${"<b></b>".repeat(n)}</i></div>`));
      this.cal = el(box, '<div class="cal abs" style="left:1100px;top:296px"><div class="calhead v"><b>10月</b><span>浴びた日に、その日の雨の数だけ雨粒</span></div>' +
        `<div class="wk v">${[..."日月火水木金土"].map((d) => `<span>${d}</span>`).join("")}</div><div class="grid">${cells.join("")}</div></div>`);
      this.calParts = [this.cal.querySelector(".calhead"), this.cal.querySelector(".wk")];
      this.days = [...this.cal.querySelectorAll(".day:not(.blank)")];
      this.days.forEach((d) => d.style.opacity = 0);
      this.n1 = el(box, '<div class="pnt2 abs v" style="left:1100px;top:846px">連続記録はない。休んだ日があっても、何も失わない</div>');
      this.n2 = el(box, '<div class="pnt2 abs v" style="left:1100px;top:900px">3日あいた18日は「おかえりなさい」から</div>');
    },
    render(t) {
      headVis(this.h, t);
      vis(this.ask, t, 0.3);
      this.opts.forEach((o, i) => vis(o, t, 0.45 + i * 0.08, { dx: 0, dy: 10 }));
      const pick = eo(seg(t, 1.1, 1.3));
      this.opts[0].style.background = pick > 0 ? mix([252, 251, 248], C.accent, pick) : "";
      this.opts[0].style.borderColor = pick > 0 ? mix(C.line2, C.accent, pick) : "";
      this.opts[0].style.color = pick > 0 ? mix(C.ink, [255, 255, 255], pick) : "";
      vis(this.cue, t, 1.35);
      vis(this.why, t, 1.6);
      stroke(this.track, eo(seg(t, 0.3, 1.0)));
      this.car.setAttribute("transform", `translate(${lerp(-520, 300, eo(seg(t, 0.4, 1.8))).toFixed(1)} 0)`);
      this.wrain.style.opacity = eo(seg(t, 1.9, 2.2)).toFixed(3);
      // The month fills in, day by day; the missed days stay empty.
      this.calParts.forEach((p, i) => vis(p, t, 2.55 + i * 0.1));
      this.days.forEach((d, i) => {
        const a = 2.75 + i * 0.045;
        d.style.opacity = eo(seg(t, a, a + 0.2)).toFixed(3);
        d.querySelectorAll("b").forEach((b) => { b.style.transform = `scaleY(${eo(seg(t, a + 0.1, a + 0.4)).toFixed(3)})`; });
        if (i === 17) d.style.boxShadow = `inset 0 0 0 2px ${rgba(C.accent, eo(seg(t, a + 0.3, a + 0.6)))}`;
      });
      vis(this.n1, t, 4.1);

  });

  scene("library", {
    name: "例文",
    stops: [
      [2.3, "例文は、働きごとに4言語でそろえて作ってあります。同じ「誘う」が、日本語・韓国語・英語・中国語で並んでいます。だから、どの組み合わせで学んでも同じ雨になります。"],
      [4.5, "例文はAIが下書きし、別のAIが査読して、引っかかったものは人が見てから公開し、音声を付けます。いま134の働き、4,020組あります。学ぶ人が使うときにAIを呼ぶのは、自分の文の添削だけです。"],
    ],
    init(box) {
      this.h = head(box, "例文", "例文は先に作って、確かめてある");
      const R = [
        ["日本語", '明日カフェ行か<span class="mk">ない</span>？', "ja"],
        ["韓国語", '내일 카페 <span class="mk">갈래</span>?', "ko"],
        ["英語", '<span class="mk">Wanna</span> go to a café tomorrow?', "en"],
        ["中国語", '明天<span class="mk">要不要</span>去咖啡厅？', "zh"],
      ];
      this.rows = R.map((r, i) => el(box, `<div class="lrow abs v${i === 3 ? " last" : ""}" style="left:120px;top:${296 + i * 84}px"><span class="lang">${r[0]}</span><span class="s t-${r[2]}">${r[1]}</span></div>`));
      this.marks = this.rows.map((r) => r.querySelector(".mk"));
      this.side = el(box, '<div class="abs v" style="left:1260px;top:300px;width:540px"><div class="label">働き</div><b class="fn">誘う</b><p class="why" style="font-size:28px">4言語でそろえた組なので、どの組み合わせで学んでも同じ雨になる</p></div>');
      this.pl = el(box, '<div class="label abs v" style="left:120px;top:676px">例文ができるまで</div>');
      const flow = el(box, '<div class="flow abs" style="left:120px;top:722px"></div>');
      [["AIが下書き", ""], ["別のAIが査読", ""], ["要確認は人が見る", " maybe"], ["公開して、音声を付ける", " pub"]].forEach((s, i) => {
        if (i) el(flow, `<span class="far v">${ARROW}</span>`);
        el(flow, `<span class="fstep v${s[1]}">${s[0]}</span>`);
      });
      this.flow = [...flow.children];
      const nums = el(box, '<div class="nums abs" style="left:120px;top:846px"></div>');
      this.nums = [["134", "の働き"], ["4,020", "組の例文"], ["4", "言語"]].map((n) => el(nums, `<div class="num v"><b>${n[0]}</b><span>${n[1]}</span></div>`));
      this.ai = el(box, '<div class="pnt3 abs v" style="left:1240px;top:858px"><span>学ぶときにAIを呼ぶのは、<br>自分の文の添削だけ</span></div>');
    },
    render(t) {
      headVis(this.h, t);
      this.rows.forEach((r, i) => vis(r, t, 0.3 + i * 0.12));
      this.marks.forEach((m, i) => mark(m, eo(seg(t, 1.2 + i * 0.1, 1.5 + i * 0.1))));
      vis(this.side, t, 1.6);
      vis(this.pl, t, 2.5);
      this.flow.forEach((f, i) => vis(f, t, 2.65 + i * 0.14));
      this.nums.forEach((n, i) => vis(n, t, 3.6 + i * 0.12, { dx: 0, dy: 12 }));
      vis(this.ai, t, 3.95);
    },
  });

  scene("why", {
    name: "なぜ効くのか",
    stops: [
      [1.7, "この流れは、言語習得や記憶の研究で知られていることに沿っています。同じかたちが、ちがう文の中で何度も出てくると、そのかたちを新しい文にも使えるようになる。気づいたところが、身につく入口になる。言おうとして初めて、言えないところに気づく。"],
      [2.8, "間をあけて出会うほうが、まとめて詰めるより長く残る。そして「〜したら〜する」と決めておくと続きやすく、1回抜けても習慣の身につき方はほとんど変わりません。"],
    ],
    init(box) {
      this.h = head(box, "なぜ効くのか", "研究で知られていることに沿っている");
      const R = [
        ["浴びる", "同じかたちに、ちがう文の中で何度も出会うと、そのかたちを新しい文にも使えるようになる", "タイプ頻度", "Bybee 1995／Ellis 2002"],
        ["気づく", "自分で気づいたところが、身につく入口になる", "気づき仮説", "Schmidt 1990"],
        ["言ってみる", "言おうとして初めて、言えないところに気づく。直されて、確かめられる", "アウトプット仮説", "Swain 1985"],
        ["また出会う", "間をあけて何度か出会うほうが、一度にまとめるより長く残る", "分散効果", "Cepeda ほか 2006"],
        ["続ける", "「〜したら、〜する」と決めておくと実行しやすい。1回抜けても、習慣の身につき方はほとんど変わらない", "実行意図・習慣化", "Gollwitzer 1999／Lally ほか 2010"],
      ];
      this.rows = R.map((r, i) => el(box, `<div class="wrow v${i === 3 ? " again" : ""}" style="top:${282 + i * 130}px"><b>${r[0]}</b><p>${r[1]}</p><div class="src"><em>${r[2]}</em><span class="t-en">${r[3]}</span></div></div>`));
    },
    render(t) {
      headVis(this.h, t);
      this.rows.forEach((r, i) => vis(r, t, i < 3 ? 0.35 + i * 0.25 : 1.85 + (i - 3) * 0.25, { dx: 0, dy: 14 }));
    },
  });

  scene("not", {
    name: "やらないこと",
    stops: [
      [2.3, "逆に、この流れに入らないものは作りません。文法の講座、テストやクイズ、復習の強制、ランキングやバッジ、連続記録。"],
      [4.0, "前のアプリは機能を広げすぎて、使い方が難しくなりました。その反省から始めています。覚えなくていい。忘れても、また降ってきます。"],
    ],
    init(box) {
      this.h = head(box, "やらないこと", "この流れに入らないものは、作らない");
      this.boxes = ["文法の講座", "テスト・クイズ", "復習の強制", "ランキング・バッジ", "連続記録"]
        .map((w, i) => el(box, `<div class="nbox v" style="left:${120 + i * 342}px">${w}<i class="x"></i></div>`));
      this.l = el(box, '<div class="label abs v" style="left:120px;top:500px">かわりに</div>');
      this.rows = ["覚えなくていい。忘れても、また降ってくる", "文法は、自分で探したあとの答え合わせで", "数えるのは自分の記録だけ。だれとも比べない", "休んだ日があっても、何も失わない"]
        .map((w, i) => el(box, `<div class="pnt4 abs v" style="left:120px;top:${548 + i * 82}px">${w}</div>`));
      this.reason = el(box, '<p class="small abs v" style="left:120px;top:900px">前のアプリは機能を広げすぎて、使い方が難しくなった。その反省から始めている</p>');
    },
    render(t) {
      headVis(this.h, t);
      this.boxes.forEach((b, i) => {
        vis(b, t, 0.3 + i * 0.12, { dx: 0, dy: 12 });
        const k = eo(seg(t, 1.2 + i * 0.15, 1.5 + i * 0.15));
        b.querySelector(".x").style.transform = `scaleX(${k.toFixed(3)})`;
        const f = eo(seg(t, 1.45 + i * 0.15, 1.8 + i * 0.15));
        b.style.color = mix(C.ink, C.faint, f);
        b.querySelector(".x").style.background = mix(C.ink, C.faint, f);
      });
      vis(this.l, t, 2.5);
      this.rows.forEach((r, i) => vis(r, t, 2.65 + i * 0.18));
      vis(this.reason, t, 3.5);
    },
  });

  scene("end", {
    name: "おわり",
    stops: [[2.0, "名前の「ことのあめ」は「言の雨」です。古今和歌集の仮名序は、歌を「人の心を種として、よろづの言の葉とぞなれりける」と書きました。例文の雨は、覚えるための完成品ではありません。何度も浴びて、また出会ううちに、自分の言葉が育っていきます。ありがとうございました。"]],
    init(box) {
      this.rain = rainField(box, 11, 1060);
      this.q = el(box, '<p class="kokin abs v" style="left:120px;top:250px">人の心を種として、よろづの言の葉とぞなれりける</p>');
      this.src = el(box, '<p class="small abs v" style="left:120px;top:312px">古今和歌集　仮名序</p>');
      const big = el(box, '<h2 class="endline abs" style="left:116px;top:420px"><span class="v">言の葉は、</span><br><span class="v">言の雨に育まれる。</span></h2>');
      this.lines = [...big.querySelectorAll("span")];
      this.sign = el(box, `<div class="sign abs v" style="left:120px;top:800px"><img src="${ICON}" alt=""><b>ことのあめ</b><span>polylinga.vercel.app</span></div>`);
    },
    render(t) {
      this.rain.canvas.style.opacity = eo(seg(t, 0, 1.2)).toFixed(3);
      vis(this.q, t, 0.2);
      vis(this.src, t, 0.35);
      this.lines.forEach((l, i) => fall(l, t, 0.6 + i * 0.3));
      vis(this.sign, t, 1.4);
    },
    idle(now) { this.rain.draw(now); },
  });

  // ---- Load: build every scene, wait for the faces, then measure ---------------------------------
  const loading = document.getElementById("loading");
  const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
  const scenes = SCENES.map((def) => {
    const box = document.createElement("div");
    box.className = "scene";
    const inner = document.createElement("div");
    inner.className = "inner";
    box.appendChild(inner);
    stage.insertBefore(box, ui);
    def.init(inner);
    const stops = def.stops.map(([at, note]) => ({ at, note }));
    const out = stops[stops.length - 1].at;
    return { def, box, inner, stops, out, dur: out + 0.5, name: def.name };
  });
  stage.querySelectorAll(".t-ko").forEach((n) => (n.lang = "ko"));
  stage.querySelectorAll(".t-zh").forEach((n) => (n.lang = "zh-CN"));
  stage.querySelectorAll(".t-en").forEach((n) => (n.lang = "en"));
  void stage.offsetHeight;
  await frame();
  await frame();
  await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 4000))]);
  for (const s of scenes) {
    if (s.def.measure) s.def.measure();
    s.def.render(0);
    s.box.style.display = "none";
    s.box.setAttribute("aria-hidden", "true");
  }
  loading.remove();

  // ---- Playback: each press plays on to the next stop ------------------------------------------------
  const N = scenes.length;
  const steps = [];
  scenes.forEach((s, i) => s.stops.forEach((p, k) => steps.push({ i, k, at: p.at, note: p.note })));
  const S = steps.length;
  let cur = 0, shown = -1, queue = [], segStart = 0, tickOn = false;
  const tickEl = document.getElementById("tick");
  function show(i) {
    if (shown === i) return;
    scenes.forEach((s, k) => { s.box.style.display = k === i ? "" : "none"; s.box.setAttribute("aria-hidden", k === i ? "false" : "true"); });
    shown = i;
  }
  // Every part of a slide leaves together, fading to the left, before the cut.
  function draw(i, t) {
    show(i);
    const s = scenes[i];
    s.def.render(t);
    const q = eio(seg(t, s.out, s.out + 0.45));
    s.inner.style.opacity = (1 - q).toFixed(3);
    s.inner.style.transform = q > 0 ? `translateX(${(-34 * q).toFixed(1)}px)` : "";
  }
  // One loop for the whole deck: it plays the queue, and lets the shown slide keep its rain falling and
  // its caret blinking while the deck waits. While playing, an all but transparent layer changes every
  // frame so the whole screen is redrawn (a still part followed by a small change made some GPUs stall).
  function loop(now) {
    requestAnimationFrame(loop);
    if (queue.length) {
      if (!segStart) segStart = now;
      const [i, a, b] = queue[0];
      const t = a + (now - segStart) / 1000;
      if (t >= b) { draw(i, b); queue.shift(); segStart = now; }
      else draw(i, t);
      tickOn = !tickOn;
      tickEl.style.opacity = tickOn ? "0.0011" : "0.001";
    }
    const s = scenes[shown];
    if (s && s.def.idle) s.def.idle(now);
  }
  function play(run) { queue = run; segStart = 0; }
  function finish() {
    if (!queue.length) return;
    const [i, , b] = queue[queue.length - 1];
    queue = [];
    draw(i, b);
  }
  function go(k) {
    k = Math.max(0, Math.min(S - 1, k));
    queue = [];
    cur = k;
    draw(steps[k].i, steps[k].at);
    chrome();
  }
  function next() {
    if (queue.length) { finish(); return; }
    if (cur >= S - 1) return;
    hideHint();
    if (RM) { go(cur + 1); return; }
    const a = steps[cur], b = steps[cur + 1];
    if (a.i === b.i) play([[a.i, a.at, b.at]]);
    else play([[a.i, a.at, scenes[a.i].dur], [b.i, 0, b.at]]);
    cur += 1;
    chrome();
  }
  function back() { finish(); go(cur - 1); }
  function chrome() {
    document.getElementById("progFill").style.transform = `scaleX(${S > 1 ? cur / (S - 1) : 1})`;
    document.getElementById("pageNo").textContent = `${steps[cur].i + 1} / ${N}`;
    renderNotes();
  }
  const hint = document.getElementById("hint");
  hint.textContent = matchMedia("(pointer: coarse)").matches ? "タップで次へ　左端で戻る" : "→ / クリックで次へ　F 全画面　N 発表メモ";
  function hideHint() { hint.style.opacity = 0; }
  setTimeout(hideHint, 9000);

  addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter" || k === "ArrowDown") { e.preventDefault(); next(); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace" || k === "ArrowUp") { e.preventDefault(); back(); }
    else if (k === "Home") { go(0); if (!RM) play([[0, 0, steps[0].at]]); }
    else if (k === "End") go(S - 1);
    else if (k === "f" || k === "F") { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else document.documentElement.requestFullscreen().catch(() => {}); }
    else if (k === "n" || k === "N") openNotes();
  });
  vp.addEventListener("click", (e) => { if (e.target.closest("#notesBar")) return; if (e.clientX < innerWidth * 0.2) back(); else next(); });

  // ---- Talk track: a second window, or a strip under the slide where windows cannot open -----------
  let notesWin = null, startedAt = 0;
  const bar = document.getElementById("notesBar");
  function openNotes() {
    let w = null;
    try { w = window.open("", "kotonoame-notes", "width=640,height=760"); } catch (err) { w = null; }
    if (!w) { bar.hidden = !bar.hidden; renderNotes(); return; }
    notesWin = w;
    const d = w.document;
    d.open();
    d.write(`<!doctype html><html lang="ja"><meta charset="utf-8"><title>発表メモ</title>
<style>body{margin:0;padding:28px 32px;font-family:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",sans-serif;color:#172033;background:#fcfbf8}
#p{font-size:15px;color:#5c6578;font-weight:700}#n{font-size:26px;line-height:1.7;margin-top:10px;font-weight:500}
#x{font-size:16px;line-height:1.7;color:#5c6578;margin-top:24px;border-top:1px solid #e4e7ec;padding-top:14px}
#tm{position:fixed;right:28px;top:24px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.k{position:fixed;left:32px;bottom:20px;font-size:13px;color:#8c94a5}</style>
<div id="p"></div><div id="tm">0:00</div><div id="n"></div><div id="x"></div><div class="k">← → でこちらからも進めます</div>`);
    d.close();
    d.addEventListener("keydown", (e) => {
      if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
      if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); back(); }
    });
    renderNotes();
  }
  function renderNotes() {
    const st = steps[cur], sc = scenes[st.i];
    const where = `${st.i + 1} / ${N}　${sc.name}` + (sc.stops.length > 1 ? `（${st.k + 1}/${sc.stops.length}）` : "");
    if (cur > 0 && !startedAt) startedAt = Date.now();
    if (!bar.hidden) {
      bar.textContent = "";
      const b = document.createElement("b");
      b.textContent = where;
      bar.append(b, st.note);
    }
    if (!notesWin || notesWin.closed) return;
    const d = notesWin.document;
    if (!d.getElementById("n")) return;
    d.getElementById("p").textContent = where;
    d.getElementById("n").textContent = st.note;
    d.getElementById("x").textContent = cur + 1 < S ? `次：${steps[cur + 1].note}` : "おわり";
  }
  setInterval(() => {
    if (!notesWin || notesWin.closed || !startedAt) return;
    const s = Math.floor((Date.now() - startedAt) / 1000);
    const n = notesWin.document.getElementById("tm");
    if (n) n.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 500);

  // For checks: draw(i, t) shows scene i at its second t; go(k) shows stop k.
  window.__deck = {
    next, go, draw, get cur() { return cur; }, get playing() { return queue.length > 0; },
    scenes: scenes.map((s) => ({ id: s.def.id, dur: s.dur, stops: s.stops.map((p) => p.at) })), steps: steps.map((p) => ({ i: p.i, at: p.at })),
  };
  chrome();
  requestAnimationFrame(loop);
  if (RM) go(0);
  else play([[0, 0, steps[0].at]]);
})().catch((e) => {
  const l = document.getElementById("loading");
  if (l) l.textContent = "読み込めませんでした: " + e.message;
  console.error(e);
